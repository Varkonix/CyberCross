<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080c10" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable (no rounded rect) -->
  <rect width="512" height="512" fill="#080c10"/>
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Centered safe-zone group (80% scale) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Subtle Grid lines -->
    <path d="M 64 0 V 512 M 128 0 V 512 M 192 0 V 512 M 256 0 V 512 M 320 0 V 512 M 384 0 V 512 M 448 0 V 512" stroke="#00ff66" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M 0 64 H 512 M 0 128 H 512 M 0 192 H 512 M 0 256 H 512 M 0 320 H 512 M 0 384 H 512 M 0 448 H 512" stroke="#00ff66" stroke-opacity="0.08" stroke-width="2"/>

    <!-- Cyber Shield Base -->
    <path d="M 256 60 L 400 120 V 260 C 400 360 256 440 256 440 C 256 440 112 360 112 260 V 120 Z" fill="#0d141d" stroke="url(#shieldGrad)" stroke-width="8" filter="url(#glow)"/>

    <!-- Crossword Cells inside Shield -->
    <rect x="136" y="216" width="44" height="44" rx="8" fill="#132337" stroke="#00f0ff" stroke-width="3"/>
    <text x="158" y="246" fill="#00f0ff" font-family="Courier New, monospace" font-size="24" font-weight="900" text-anchor="middle">C</text>

    <rect x="188" y="216" width="44" height="44" rx="8" fill="#132337" stroke="#00f0ff" stroke-width="3"/>
    <text x="210" y="246" fill="#00f0ff" font-family="Courier New, monospace" font-size="24" font-weight="900" text-anchor="middle">Y</text>

    <rect x="240" y="216" width="44" height="44" rx="8" fill="#00ff66" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
    <text x="262" y="247" fill="#080c10" font-family="Courier New, monospace" font-size="26" font-weight="900" text-anchor="middle">B</text>

    <rect x="292" y="216" width="44" height="44" rx="8" fill="#132337" stroke="#00f0ff" stroke-width="3"/>
    <text x="314" y="246" fill="#00f0ff" font-family="Courier New, monospace" font-size="24" font-weight="900" text-anchor="middle">E</text>

    <rect x="344" y="216" width="44" height="44" rx="8" fill="#132337" stroke="#00f0ff" stroke-width="3"/>
    <text x="366" y="246" fill="#00f0ff" font-family="Courier New, monospace" font-size="24" font-weight="900" text-anchor="middle">R</text>

    <rect x="240" y="164" width="44" height="44" rx="8" fill="#132337" stroke="#00ff66" stroke-width="3"/>
    <text x="262" y="194" fill="#00ff66" font-family="Courier New, monospace" font-size="24" font-weight="900" text-anchor="middle">O</text>

    <rect x="240" y="268" width="44" height="44" rx="8" fill="#132337" stroke="#00ff66" stroke-width="3"/>
    <text x="262" y="298" fill="#00ff66" font-family="Courier New, monospace" font-size="24" font-weight="900" text-anchor="middle">T</text>

    <rect x="240" y="320" width="44" height="44" rx="8" fill="#132337" stroke="#00ff66" stroke-width="3"/>
    <text x="262" y="350" fill="#00ff66" font-family="Courier New, monospace" font-size="24" font-weight="900" text-anchor="middle">S</text>

    <path d="M 210 395 L 225 405 L 210 415" fill="none" stroke="#00ff66" stroke-width="3" stroke-linecap="round"/>
    <line x1="235" y1="415" x2="255" y2="415" stroke="#00ff66" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>